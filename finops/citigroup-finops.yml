alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Citigroup
providerId: citigroup
publisherName: Citibank, N.A.
serviceCategory: Banking
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Financial Services
  - Payments
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps shape for Citi's developer APIs. Cost is driven by Citi's underlying
  banking, payments, FX, and treasury services - APIs themselves are not separately metered; charges
  flow from per-transaction wire / ACH / FX fees and account-level service charges in the master cash-
  management agreement.
notes: Per-API meters below are placeholders that mirror typical Citi cash-management / payments line
  items. Real billing arrives through bank account analysis statements rather than a developer
  invoice.
sources:
  - https://developer.citi.com
  - https://www.citibank.com/tts/sa/index.jsp
billingModel:
  pricingCategory: Take Rate + Per-Transaction Fees
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Tax
    - Adjustment
    - Refund
    - Credit
focusColumns:
  ServiceName: Citigroup
  ServiceCategory: Banking
  ProviderName: Citi
  PublisherName: Citibank, N.A.
  InvoiceIssuerName: Citibank, N.A.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: payment_transactions
    description: Wire / ACH / SWIFT payments initiated via CitiConnect / Citi Developer Hub APIs.
    unit: transaction
    aggregation: sum
    dimensions:
      - rail
      - currency
      - geography
  - name: fx_volume
    description: Notional FX volume executed via Citi Velocity APIs.
    unit: notional
    aggregation: sum
    dimensions:
      - currency_pair
      - tenor
  - name: account_services
    description: Monthly account-level service charges (statement reporting, balance reporting,
      reconciliation files).
    unit: account-month
    aggregation: max
    dimensions:
      - account_type
      - geography
  - name: api_calls
    description: API call counts (informational; not directly billed).
    unit: request
    aggregation: sum
    dimensions:
      - api_product
      - environment
principles:
  - name: Visibility
    description: Use Citi's Account Analysis (Citi AccountLink / EDI 822) statements and the Citi
      Developer Hub usage dashboard to track per-product API consumption alongside transaction fees.
  - name: Allocation
    description: Tag every API client / app to a Citi account number and business unit so wire / ACH
      / FX line items can be attributed back to the consuming team.
  - name: Optimization
    description: Batch low-priority payments to lower per-transaction rails (ACH vs wire), reuse
      OAuth tokens, and reduce intra-day balance-reporting polling cadence.
  - name: Accountability
    description: Treasury operations owns Citi service-fee budgets; partner integration owners are
      accountable for clean reconciliation and exception management to avoid investigation fees.
maintainers:
