findings:
  - Real, mature two-surface public API program; among the earliest bank open-banking efforts (2016).
  - Retail catalog of seven documented product families plus a four-product CitiConnect corporate suite.
  - No machine-readable artifacts (OpenAPI/Postman/SDK) are publicly downloadable; documentation is HTML/partner-gated.
  - Open-finance data access is intermediated through Akoya (co-owned) under FDX / CFPB 1033 norms rather than a bespoke public endpoint.
  - Removed a broken X-NaftikoCapabilities pointer (no capabilities/ directory present); added verified Plans, RateLimits, FinOps, and Blog pointers.
